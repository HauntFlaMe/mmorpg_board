<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доска объявлений</title>
</head>
<body>
    <header>
        <h1><a href="{% url 'post_list' %}">Доска объявлений</a></h1>
        <nav>
            {% if user.is_authenticated %}
                <p>Вы вошли как {{ user.username }} | <a href="{% url 'account_logout' %}">Выйти</a></p>
            {% else %}
                <p><a href="{% url 'account_login' %}">Войти</a> | <a href="{% url 'account_signup' %}">Зарегистрироваться</a></p>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
