<form method="get">
    <input type="text" name="q" placeholder="Поиск...">
    <button type="submit">Найти</button>
</form>

<ul>
    {% for response in responses %}
        <li>
            <p>{{ response.text }}</p>
            <p>Автор: {{ response.author.username }}</p>
            <p>Дата: {{ response.created_at }}</p>
        </li>
    {% empty %}
        <li>Откликов пока нет.</li>
    {% endfor %}
</ul>
